# ADM-003: quota de treino com contagem de objetos e escopos. Aplicar como admin, só em projetos ac17-*:
#   oc apply --dry-run=server -f manifests/admin/quota-completa.yaml -n ac17-cotas
#   oc apply -f manifests/admin/quota-completa.yaml -n ac17-cotas
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ac17-computacao
  labels:
    academy.openshift.dev/managed-by: academia
spec:
  hard:
    requests.cpu: "300m"
    requests.memory: 384Mi
    limits.cpu: "1"
    limits.memory: 768Mi
    pods: "4"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ac17-objetos
  labels:
    academy.openshift.dev/managed-by: academia
spec:
  hard:
    count/deployments.apps: "3"
    count/configmaps: "10"
    count/secrets: "15"
    services: "3"
    services.nodeports: "0"
    services.loadbalancers: "0"
    persistentvolumeclaims: "0"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ac17-sem-requests
  labels:
    academy.openshift.dev/managed-by: academia
spec:
  scopes:
    - BestEffort
  hard:
    pods: "1"
