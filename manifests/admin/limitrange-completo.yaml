# ADM-005: LimitRange com padrões, mínimos, máximos e razão limite/request. Aplicar como admin em ac17-*.
apiVersion: v1
kind: LimitRange
metadata:
  name: ac17-limites
  labels:
    academy.openshift.dev/managed-by: academia
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 32Mi
      default:
        cpu: 100m
        memory: 128Mi
      min:
        cpu: 10m
        memory: 16Mi
      max:
        cpu: 250m
        memory: 256Mi
      maxLimitRequestRatio:
        cpu: "10"
    - type: Pod
      max:
        cpu: 500m
        memory: 512Mi
