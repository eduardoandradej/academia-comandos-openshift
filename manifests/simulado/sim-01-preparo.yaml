apiVersion: apps/v1
kind: Deployment
metadata:
  name: raiz
  namespace: ac-sim-raiz
  labels:
    app: raiz
    academy.openshift.dev/managed-by: academia
    academy.openshift.dev/simulado: sim-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: raiz
  template:
    metadata:
      labels:
        app: raiz
        academy.openshift.dev/managed-by: academia
        academy.openshift.dev/simulado: sim-01
    spec:
      securityContext:
        runAsUser: 0
      containers:
        - name: raiz
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              while true; do echo "processo rodando como uid $(id -u)"; sleep 30; done
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculo
  namespace: ac-sim-memoria
  labels:
    app: calculo
    academy.openshift.dev/managed-by: academia
    academy.openshift.dev/simulado: sim-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calculo
  template:
    metadata:
      labels:
        app: calculo
        academy.openshift.dev/managed-by: academia
        academy.openshift.dev/simulado: sim-01
    spec:
      containers:
        - name: calculo
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              dd if=/dev/zero of=/dev/null bs=48M count=1 2>/dev/null && echo "cálculo concluído"
              exec sleep infinity
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
