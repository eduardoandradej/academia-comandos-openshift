# Simulado 01 — preparação. Aplicado por scripts/simulado/sim-01-prepara.sh (perfil developer).
# Objetos já existentes no início do simulado; alguns estão incompletos DE PROPÓSITO (tarefas 07, 09, 11, 12 e 13).
# Não leia antes de fazer o simulado se quiser o efeito surpresa.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vitrine
  namespace: ac-sim-vitrine
  labels:
    app: vitrine
    academy.openshift.dev/managed-by: academia
    academy.openshift.dev/simulado: sim-01
data:
  index.html: |
    vitrine do simulado
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitrine
  namespace: ac-sim-vitrine
  labels:
    app: vitrine
    academy.openshift.dev/managed-by: academia
    academy.openshift.dev/simulado: sim-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vitrine
  template:
    metadata:
      labels:
        app: vitrine
        academy.openshift.dev/managed-by: academia
        academy.openshift.dev/simulado: sim-01
    spec:
      containers:
        - name: vitrine
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: pagina
              mountPath: /var/www/html
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: pagina
          configMap:
            name: vitrine
---
apiVersion: v1
kind: Service
metadata:
  name: vitrine
  namespace: ac-sim-vitrine
  labels:
    app: vitrine
    academy.openshift.dev/managed-by: academia
    academy.openshift.dev/simulado: sim-01
spec:
  selector:
    app: vitrine
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: vitrine
  namespace: ac-sim-vitrine
  labels:
    app: vitrine
    academy.openshift.dev/managed-by: academia
    academy.openshift.dev/simulado: sim-01
spec:
  to:
    kind: Service
    name: vitrine
  port:
    targetPort: http
---
apiVersion: apps/v1
