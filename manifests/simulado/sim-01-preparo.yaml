apiVersion: apps/v1
kind: Deployment
metadata:
  name: consulta
  namespace: ac-sim-cliente
  labels:
    app: consulta
    academy.openshift.dev/managed-by: academia
    academy.openshift.dev/simulado: sim-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consulta
  template:
    metadata:
      labels:
        app: consulta
        academy.openshift.dev/managed-by: academia
        academy.openshift.dev/simulado: sim-01
        acesso: leitura-banco
    spec:
      containers:
        - name: consulta
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              while true; do
                if timeout 3 bash -c "</dev/tcp/banco.ac-sim-dados.svc/8080" 2>/dev/null; then echo "$(date +%T) banco: conectado"; else echo "$(date +%T) banco: sem resposta"; fi
                sleep 10
              done
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
