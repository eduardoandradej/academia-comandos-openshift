# Baseline de segurança para namespaces de laboratório (ac-* / acNN-*).
# Aplicar como "admin" (developer não pode criar ResourceQuota):
#   oc apply --dry-run=server -f manifests/baseline-seguro/quota-limitrange.yaml -n <ns>
#   oc apply -f manifests/baseline-seguro/quota-limitrange.yaml -n <ns>
# Dimensionado para o SNO do HomeLab (6 vCPU / 20 GiB RAM compartilhados com o
# control plane). Não contém o campo namespace de propósito: sempre use -n.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ac-quota
  labels:
    academy.openshift.dev/managed-by: academia
spec:
  hard:
    pods: "6"
    requests.cpu: "500m"
    requests.memory: 768Mi
    limits.cpu: "2"
    limits.memory: 1536Mi
    configmaps: "20"
    secrets: "30"
    services: "5"
    services.loadbalancers: "0"
    services.nodeports: "0"
    persistentvolumeclaims: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ac-limits
  labels:
    academy.openshift.dev/managed-by: academia
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 200m
        memory: 256Mi
      max:
        cpu: 500m
        memory: 512Mi
