{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "ac14-loja.fullname" . }}
  labels:
    {{- include "ac14-loja.labels" . | nindent 4 }}
spec:
  {{- with .Values.route.host }}
  host: {{ . }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "ac14-loja.fullname" . }}
  port:
    targetPort: http
{{- end }}
