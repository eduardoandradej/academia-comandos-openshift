apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ac14-loja.fullname" . }}-teste
  labels:
    {{- include "ac14-loja.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: teste
      image: {{ include "ac14-loja.image" . | quote }}
      command:
        - /bin/bash
        - -c
        - >-
          exec 3<>/dev/tcp/{{ include "ac14-loja.fullname" . }}/8080 &&
          printf 'GET / HTTP/1.0\r\n\r\n' >&3 &&
          grep -q {{ .Values.pagina.conteudo | quote }} <&3 &&
          echo "pagina conferida"
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 50m, memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
