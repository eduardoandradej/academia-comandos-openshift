# Caso 09 (Trilha 19): duas aplicações reiniciam ou somem sozinhas.
# Aplicar SEM ler o resto do arquivo (o diagnóstico é o exercício):
#   oc apply -f manifests/casos/caso-09.yaml -n ac19-casos
# Limpeza: oc delete -f manifests/casos/caso-09.yaml -n ac19-casos --ignore-not-found
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ac19-c9
  labels:
    app: ac19-c9
    academy.openshift.dev/managed-by: academia
    academy.openshift.dev/caso: "09"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ac19-c9
  template:
    metadata:
      labels:
        app: ac19-c9
        academy.openshift.dev/managed-by: academia
        academy.openshift.dev/caso: "09"
    spec:
      containers:
        - name: web
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: {cpu: 25m, memory: 16Mi}
            limits: {cpu: 100m, memory: 20Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ac19-c9-cache
  labels:
    app: ac19-c9-cache
    academy.openshift.dev/managed-by: academia
    academy.openshift.dev/caso: "09"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ac19-c9-cache
  template:
    metadata:
      labels:
        app: ac19-c9-cache
        academy.openshift.dev/managed-by: academia
        academy.openshift.dev/caso: "09"
    spec:
      containers:
        - name: web
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          ports:
            - name: http
              containerPort: 8080
          command: ["/bin/sh", "-c", "dd if=/dev/zero of=/cache/aquecimento bs=1M count=24 && exec run-httpd"]
          volumeMounts:
            - name: cache
              mountPath: /cache
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 8Mi
