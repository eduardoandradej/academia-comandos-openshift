# Caso 07 (Trilha 19): a aplicação de pedidos (estado inicial saudável; o defeito vem no exercício).
# Aplicar SEM ler o resto do arquivo (o diagnóstico é o exercício):
#   oc apply -f manifests/casos/caso-07.yaml -n ac19-casos
# Limpeza: oc delete -f manifests/casos/caso-07.yaml -n ac19-casos --ignore-not-found
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ac19-c7
  labels:
    app: ac19-c7
    academy.openshift.dev/managed-by: academia
    academy.openshift.dev/caso: "07"
spec:
  replicas: 2
  revisionHistoryLimit: 0
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ac19-c7
  template:
    metadata:
      labels:
        app: ac19-c7
        academy.openshift.dev/managed-by: academia
        academy.openshift.dev/caso: "07"
    spec:
      containers:
        - name: web
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
