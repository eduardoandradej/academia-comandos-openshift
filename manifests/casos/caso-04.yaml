# Caso 04 (Trilha 19): o relatório nunca sai do Pending.
# Aplicar SEM ler o resto do arquivo (o diagnóstico é o exercício):
#   oc apply -f manifests/casos/caso-04.yaml -n ac19-casos
# Limpeza: oc delete -f manifests/casos/caso-04.yaml -n ac19-casos --ignore-not-found
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ac19-c4
  labels:
    app: ac19-c4
    academy.openshift.dev/managed-by: academia
    academy.openshift.dev/caso: "04"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ac19-c4
  template:
    metadata:
      labels:
        app: ac19-c4
        academy.openshift.dev/managed-by: academia
        academy.openshift.dev/caso: "04"
    spec:
      nodeSelector:
        disktype: nvme
      containers:
        - name: web
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: {cpu: "8", memory: 64Mi}
            limits: {cpu: "8", memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
