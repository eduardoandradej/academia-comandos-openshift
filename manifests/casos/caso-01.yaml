# Caso 01 (Trilha 19): a vitrine nova não responde pelo Service.
# Aplicar SEM ler o resto do arquivo (o diagnóstico é o exercício):
#   oc apply -f manifests/casos/caso-01.yaml -n ac19-casos
# Limpeza: oc delete -f manifests/casos/caso-01.yaml -n ac19-casos --ignore-not-found
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ac19-c1
  labels:
    app: ac19-c1
    academy.openshift.dev/managed-by: academia
    academy.openshift.dev/caso: "01"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ac19-c1
  template:
    metadata:
      labels:
        app: ac19-c1
        academy.openshift.dev/managed-by: academia
        academy.openshift.dev/caso: "01"
    spec:
      containers:
        - name: web
          image: registry.access.redhat.com/ubi9/httpd-24:2.4-sem-esta-tag
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: ac19-c1
  labels:
    app: ac19-c1
    academy.openshift.dev/managed-by: academia
    academy.openshift.dev/caso: "01"
spec:
  selector:
    app: ac19-c1-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
