# Patch estratégico: mescla por nome do contêiner; não precisa repetir o resto do Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ac13-loja
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      containers:
        - name: web
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 100m, memory: 128Mi}
