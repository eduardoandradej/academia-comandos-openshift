apiVersion: apps/v1
kind: Deployment
metadata:
  name: ac13-loja
  labels:
    app: ac13-loja
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ac13-loja
  template:
    metadata:
      labels:
        app: ac13-loja
    spec:
      containers:
        - name: web
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: pagina
              mountPath: /var/www/html
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: pagina
          configMap:
            name: ac13-pagina
